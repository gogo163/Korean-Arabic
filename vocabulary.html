<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الكلمات الأساسية — 기초 어휘</title>
<style>
  :root {
    --primary: #6C4CE0;
    --primary-light: #9B7FF0;
    --accent: #FF6FA5;
    --bg: #F7F5FF;
    --card: #FFFFFF;
    --text: #2A2140;
    --success: #34C77B;
    --danger: #E0567A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, #ECE7FF 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    padding-bottom: 50px;
  }
  .app { max-width: 480px; margin: 0 auto; }

  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: white; color: var(--primary);
    border: 2px solid #EDEAFB; border-radius: 12px;
    padding: 8px 14px; font-size: 12.5px; font-weight: bold;
    text-decoration: none; margin-bottom: 14px;
  }

  header { text-align: center; margin-bottom: 14px; }
  header h1 { font-size: 19px; color: var(--primary); }
  header p { font-size: 12px; color: #8A82A6; margin-top: 4px; }

  #voice-warning {
    display: none;
    background: #FFF3E0; color: #B36B00;
    font-size: 11.5px; padding: 10px 14px; border-radius: 12px;
    margin-bottom: 14px; line-height: 1.6; text-align: center;
  }
  #voice-warning.show { display: block; }

  .mode-tabs {
    display: flex; gap: 8px; margin-bottom: 16px;
    background: white; padding: 6px; border-radius: 14px;
    box-shadow: 0 4px 14px rgba(108,76,224,0.08);
  }
  .mode-btn {
    flex: 1; border: none; background: transparent;
    padding: 10px 4px; border-radius: 10px;
    font-size: 12.5px; font-weight: bold; color: #9992B5; cursor: pointer;
    position: relative;
  }
  .mode-btn.active { background: var(--primary); color: white; }
  .due-badge {
    position: absolute; top: 2px; left: 8px;
    background: var(--accent); color: white;
    font-size: 9px; padding: 1px 5px; border-radius: 999px;
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ---- Browse mode ---- */
  .category-scroll {
    display: flex; gap: 8px; overflow-x: auto;
    margin-bottom: 16px; padding-bottom: 4px;
  }
  .category-chip {
    flex: 0 0 auto;
    background: white; color: var(--primary);
    border: 2px solid #EDEAFB;
    padding: 9px 16px; border-radius: 999px;
    font-size: 12.5px; font-weight: bold; white-space: nowrap; cursor: pointer;
  }
  .category-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: white; border-radius: 14px; padding: 10px 14px;
    margin-bottom: 14px; box-shadow: 0 3px 10px rgba(108,76,224,0.08);
  }
  .search-box input {
    border: none; outline: none; flex: 1; font-size: 13px;
    font-family: inherit; background: transparent; color: var(--text);
  }
  .search-box .icon { color: var(--primary); }
  .empty-state {
    text-align: center; color: #B0A8CC; font-size: 13px;
    padding: 30px 0;
  }

  .word-card {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: 0 4px 14px rgba(108,76,224,0.08);
    display: flex; align-items: center; gap: 12px;
  }
  .word-card .info { flex: 1; }
  .word-kr { font-size: 17px; font-weight: bold; }
  .word-roman { font-size: 11.5px; color: var(--primary); margin-top: 2px; }
  .word-ar { font-size: 12.5px; color: #8A82A6; margin-top: 4px; }
  .play-btn {
    flex: 0 0 auto;
    width: 38px; height: 38px; border-radius: 50%;
    background: #F1ECFF; color: var(--primary);
    border: none; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .play-btn.playing { background: var(--primary); color: white; }

  /* ---- Review mode ---- */
  .review-empty {
    text-align: center; padding: 40px 20px;
    background: white; border-radius: 20px;
    box-shadow: 0 4px 14px rgba(108,76,224,0.08);
  }
  .review-empty .big-emoji { font-size: 40px; margin-bottom: 10px; }
  .review-empty p { font-size: 13px; color: #8A82A6; line-height: 1.7; }

  .review-progress { text-align: center; font-size: 12px; color: #8A82A6; margin-bottom: 12px; }

  .flashcard {
    background: white;
    border-radius: 22px;
    min-height: 220px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
    box-shadow: 0 6px 20px rgba(108,76,224,0.12);
    margin-bottom: 16px;
    cursor: pointer;
    text-align: center;
  }
  .flashcard .fc-kr { font-size: 32px; font-weight: bold; color: var(--text); }
  .flashcard .fc-roman { font-size: 13px; color: var(--primary); margin-top: 8px; }
  .flashcard .fc-hint { font-size: 11px; color: #B0A8CC; margin-top: 14px; }
  .flashcard .fc-ar { font-size: 16px; color: var(--accent); font-weight: bold; margin-top: 14px; display: none; }
  .flashcard.flipped .fc-ar { display: block; }
  .flashcard.flipped .fc-hint { display: none; }

  .review-play {
    background: #F1ECFF; color: var(--primary); border: none;
    border-radius: 12px; padding: 8px 16px; font-size: 12px;
    font-weight: bold; margin-top: 12px; cursor: pointer;
  }

  .quality-buttons {
    display: none;
    gap: 8px;
  }
  .quality-buttons.show { display: grid; grid-template-columns: repeat(4, 1fr); }
  .quality-buttons button {
    border: none; border-radius: 12px; padding: 12px 4px;
    font-size: 11px; font-weight: bold; cursor: pointer; color: white;
  }
  .q-again { background: var(--danger); }
  .q-hard { background: #E0A756; }
  .q-good { background: var(--primary-light); }
  .q-easy { background: var(--success); }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: white;
    padding: 10px 18px; border-radius: 12px; font-size: 13px;
    opacity: 0; transition: all 0.3s ease; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app">
  <a href="index.html" class="back-btn">→ الرئيسية</a>

  <header>
    <h1>📚 الكلمات الأساسية</h1>
    <p>كلمات هتستخدمها كل يوم — بنظام مراجعة ذكي</p>
  </header>

  <div id="voice-warning">
    ⚠️ المتصفح بتاعك مش لاقي صوت كوري مثبّت. الجُمل هتتعرض من غير صوت.
  </div>

  <div class="mode-tabs">
    <button class="mode-btn active" data-mode="browse">📖 تصفّح الكل</button>
    <button class="mode-btn" data-mode="review">
      🧠 مراجعة اليوم
      <span class="due-badge" id="due-badge" style="display:none;">0</span>
    </button>
  </div>

  <!-- ===================== BROWSE VIEW ===================== -->
  <div class="view active" id="view-browse">
    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="text" id="search-input" placeholder="دوّر عن كلمة... (عربي أو كوري)" />
    </div>
    <div class="category-scroll" id="category-scroll"></div>
    <div id="word-list"></div>
  </div>

  <!-- ===================== REVIEW VIEW ===================== -->
  <div class="view" id="view-review">
    <div id="review-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="progress.js"></script>
<script src="audio-helper.js"></script>
<script>
  // -------------------------------------------------------------
  // بنك الكلمات الأساسية — مصنّف حسب الموضوع
  // -------------------------------------------------------------
  const CATEGORIES = [
    {
      id: "numbers",
      chip: "🔢 أرقام",
      words: [
        { kr: "하나", roman: "hana", ar: "واحد" },
        { kr: "둘", roman: "dul", ar: "اتنين" },
        { kr: "셋", roman: "set", ar: "تلاتة" },
        { kr: "넷", roman: "net", ar: "أربعة" },
        { kr: "다섯", roman: "daseot", ar: "خمسة" },
        { kr: "여섯", roman: "yeoseot", ar: "ستة" },
        { kr: "일곱", roman: "ilgop", ar: "سبعة" },
        { kr: "여덟", roman: "yeodeol", ar: "تمانية" },
      ],
    },
    {
      id: "colors",
      chip: "🎨 ألوان",
      words: [
        { kr: "빨간색", roman: "ppalgansaek", ar: "أحمر" },
        { kr: "파란색", roman: "paransaek", ar: "أزرق" },
        { kr: "노란색", roman: "noransaek", ar: "أصفر" },
        { kr: "초록색", roman: "chorosaek", ar: "أخضر" },
        { kr: "검은색", roman: "geomeunsaek", ar: "أسود" },
        { kr: "흰색", roman: "huinsaek", ar: "أبيض" },
        { kr: "분홍색", roman: "bunhongsaek", ar: "وردي" },
        { kr: "보라색", roman: "borasaek", ar: "بنفسجي" },
      ],
    },
    {
      id: "family",
      chip: "👨‍👩‍👧 العائلة",
      words: [
        { kr: "가족", roman: "gajok", ar: "عيلة" },
        { kr: "아버지", roman: "abeoji", ar: "أب" },
        { kr: "어머니", roman: "eomeoni", ar: "أم" },
        { kr: "형제", roman: "hyeongje", ar: "إخوات (ولاد)" },
        { kr: "언니", roman: "eonni", ar: "أخت أكبر (بنت بتقولها)" },
        { kr: "오빠", roman: "oppa", ar: "أخ أكبر (بنت بتقوله)" },
        { kr: "동생", roman: "dongsaeng", ar: "الأخ/الأخت الأصغر" },
        { kr: "할머니", roman: "halmeoni", ar: "جدة" },
      ],
    },
    {
      id: "food",
      chip: "🍜 أكل وشرب",
      words: [
        { kr: "밥", roman: "bap", ar: "رز / أكل بشكل عام" },
        { kr: "물", roman: "mul", ar: "مية" },
        { kr: "김치", roman: "gimchi", ar: "كيمتشي" },
        { kr: "고기", roman: "gogi", ar: "لحمة" },
        { kr: "과일", roman: "gwail", ar: "فاكهة" },
        { kr: "커피", roman: "keopi", ar: "قهوة" },
        { kr: "빵", roman: "ppang", ar: "عيش" },
        { kr: "맛있어요", roman: "masisseoyo", ar: "لذيذ" },
      ],
    },
    {
      id: "time",
      chip: "🕐 الوقت",
      words: [
        { kr: "오늘", roman: "oneul", ar: "النهاردة" },
        { kr: "내일", roman: "naeil", ar: "بكرة" },
        { kr: "어제", roman: "eoje", ar: "إمبارح" },
        { kr: "지금", roman: "jigeum", ar: "دلوقتي" },
        { kr: "아침", roman: "achim", ar: "الصبح" },
        { kr: "저녁", roman: "jeonyeok", ar: "بالليل / المسا" },
        { kr: "매일", roman: "maeil", ar: "كل يوم" },
        { kr: "시간", roman: "sigan", ar: "وقت / ساعة" },
      ],
    },
    {
      id: "places",
      chip: "📍 أماكن",
      words: [
        { kr: "집", roman: "jip", ar: "بيت" },
        { kr: "학교", roman: "hakgyo", ar: "مدرسة" },
        { kr: "회사", roman: "hoesa", ar: "شركة / شغل" },
        { kr: "병원", roman: "byeongwon", ar: "مستشفى" },
        { kr: "화장실", roman: "hwajangsil", ar: "حمّام" },
        { kr: "공항", roman: "gonghang", ar: "مطار" },
        { kr: "시장", roman: "sijang", ar: "سوق" },
        { kr: "역", roman: "yeok", ar: "محطة (مترو/قطر)" },
      ],
    },
  ];

  const ALL_WORDS = CATEGORIES.flatMap((c) => c.words.map((w) => ({ ...w, categoryId: c.id })));
  let currentCategoryId = "numbers";
  let currentMode = "browse";

  // ---------------- Audio (WAV أولاً، speechSynthesis كبديل تلقائي) ----------------
  function speak(kr, roman) {
    playKoreanAudio(kr, roman, "audio/vocabulary");
  }

  // ---------------- Mode tabs ----------------
  document.querySelectorAll(".mode-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      currentMode = btn.dataset.mode;
      document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`view-${currentMode}`).classList.add("active");
      if (currentMode === "review") renderReview();
    });
  });

  // ---------------- Browse mode ----------------
  let searchQuery = "";
  const categoryScroll = document.getElementById("category-scroll");
  categoryScroll.innerHTML = CATEGORIES.map(
    (c) => `<div class="category-chip ${c.id === currentCategoryId ? "active" : ""}" data-id="${c.id}">${c.chip}</div>`
  ).join("");

  categoryScroll.querySelectorAll(".category-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      currentCategoryId = chip.dataset.id;
      renderBrowse();
    });
  });

  document.getElementById("search-input").addEventListener("input", (e) => {
    searchQuery = e.target.value.trim().toLowerCase();
    renderBrowse();
  });

  function getVisibleWords() {
    if (searchQuery) {
      return ALL_WORDS.filter(
        (w) =>
          w.ar.toLowerCase().includes(searchQuery) ||
          w.roman.toLowerCase().includes(searchQuery) ||
          w.kr.includes(searchQuery)
      );
    }
    const cat = CATEGORIES.find((c) => c.id === currentCategoryId);
    return cat ? cat.words : [];
  }

  function renderBrowse() {
    categoryScroll.style.display = searchQuery ? "none" : "flex";
    categoryScroll.querySelectorAll(".category-chip").forEach((c) =>
      c.classList.toggle("active", c.dataset.id === currentCategoryId)
    );

    const words = getVisibleWords();
    const list = document.getElementById("word-list");

    if (words.length === 0) {
      list.innerHTML = `<div class="empty-state">مفيش نتائج... جرّب كلمة تانية 🔍</div>`;
      return;
    }

    list.innerHTML = words
      .map(
        (w) => `
        <div class="word-card">
          <button class="play-btn" data-text="${w.kr}" data-roman="${w.roman}">🔊</button>
          <div class="info">
            <div class="word-kr">${w.kr}</div>
            <div class="word-roman">${w.roman}</div>
            <div class="word-ar">${w.ar}</div>
          </div>
        </div>`
      )
      .join("");

    list.querySelectorAll(".play-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        speak(btn.dataset.text, btn.dataset.roman);
        btn.classList.add("playing");
        setTimeout(() => btn.classList.remove("playing"), 700);
      });
    });
  }

  // ---------------- Review mode (SRS) ----------------
  let reviewQueue = [];
  let reviewIndex = 0;
  let isFlipped = false;

  function getWordKey(w) {
    return `vocab_${w.categoryId}_${w.kr}`;
  }

  function updateDueBadge() {
    const dueIds = KoreanProgress.getDueCards(ALL_WORDS.map(getWordKey));
    const badge = document.getElementById("due-badge");
    if (dueIds.length > 0) {
      badge.style.display = "inline-block";
      badge.textContent = dueIds.length;
    } else {
      badge.style.display = "none";
    }
  }

  function renderReview() {
    const dueIds = new Set(KoreanProgress.getDueCards(ALL_WORDS.map(getWordKey)));
    reviewQueue = ALL_WORDS.filter((w) => dueIds.has(getWordKey(w)));
    reviewIndex = 0;
    isFlipped = false;
    renderReviewCard();
  }

  function renderReviewCard() {
    const content = document.getElementById("review-content");

    if (reviewQueue.length === 0) {
      content.innerHTML = `
        <div class="review-empty">
          <div class="big-emoji">🎉</div>
          <p>مفيش كلمات محتاجة مراجعة دلوقتي!<br/>ارجع تاني بكرة، أو تصفّح الكلمات من التاب التاني.</p>
        </div>`;
      return;
    }

    if (reviewIndex >= reviewQueue.length) {
      content.innerHTML = `
        <div class="review-empty">
          <div class="big-emoji">✅</div>
          <p>خلّصت كل مراجعات النهاردة! جاهز كمان بكرة.</p>
        </div>`;
      updateDueBadge();
      return;
    }

    const word = reviewQueue[reviewIndex];
    content.innerHTML = `
      <div class="review-progress">كلمة ${reviewIndex + 1} من ${reviewQueue.length}</div>
      <div class="flashcard" id="flashcard">
        <div class="fc-kr">${word.kr}</div>
        <div class="fc-roman">${word.roman}</div>
        <div class="fc-hint">👆 دوس عشان تشوف المعنى</div>
        <div class="fc-ar">${word.ar}</div>
      </div>
      <div style="text-align:center;">
        <button class="review-play" id="review-play-btn">🔊 اسمع النطق</button>
      </div>
      <div class="quality-buttons" id="quality-buttons">
        <button class="q-again" data-q="1">غلط 😖</button>
        <button class="q-hard" data-q="3">صعبة 😐</button>
        <button class="q-good" data-q="4">تمام 🙂</button>
        <button class="q-easy" data-q="5">سهلة 😎</button>
      </div>`;

    document.getElementById("flashcard").addEventListener("click", () => {
      isFlipped = true;
      document.getElementById("flashcard").classList.add("flipped");
      document.getElementById("quality-buttons").classList.add("show");
    });

    document.getElementById("review-play-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      speak(word.kr, word.roman);
    });

    document.querySelectorAll(".quality-buttons button").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const quality = parseInt(btn.dataset.q, 10);
        KoreanProgress.reviewCard(getWordKey(word), quality);
        reviewIndex++;
        isFlipped = false;
        renderReviewCard();
      });
    });
  }

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
  }

  // ---------------- Init ----------------
  renderBrowse();
  updateDueBadge();
</script>
</body>
</html>
