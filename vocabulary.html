<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الكلمات الأساسية — 기초 어휘</title>
<style>
  :root {
    --primary: #6C4CE0;
    --primary-light: #9B7FF0;
    --accent: #FF6FA5;
    --bg: #F7F5FF;
    --card: #FFFFFF;
    --text: #2A2140;
    --success: #34C77B;
    --danger: #E0567A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, #ECE7FF 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    padding-bottom: 50px;
  }
  .app { max-width: 480px; margin: 0 auto; }

  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: white; color: var(--primary);
    border: 2px solid #EDEAFB; border-radius: 12px;
    padding: 8px 14px; font-size: 12.5px; font-weight: bold;
    text-decoration: none; margin-bottom: 14px;
  }

  header { text-align: center; margin-bottom: 14px; }
  header h1 { font-size: 19px; color: var(--primary); }
  header p { font-size: 12px; color: #8A82A6; margin-top: 4px; }

  #voice-warning {
    display: none;
    background: #FFF3E0; color: #B36B00;
    font-size: 11.5px; padding: 10px 14px; border-radius: 12px;
    margin-bottom: 14px; line-height: 1.6; text-align: center;
  }
  #voice-warning.show { display: block; }

  .mode-tabs {
    display: flex; gap: 8px; margin-bottom: 16px;
    background: white; padding: 6px; border-radius: 14px;
    box-shadow: 0 4px 14px rgba(108,76,224,0.08);
  }
  .mode-btn {
    flex: 1; border: none; background: transparent;
    padding: 10px 4px; border-radius: 10px;
    font-size: 12.5px; font-weight: bold; color: #9992B5; cursor: pointer;
    position: relative;
  }
  .mode-btn.active { background: var(--primary); color: white; }
  .due-badge {
    position: absolute; top: 2px; left: 8px;
    background: var(--accent); color: white;
    font-size: 9px; padding: 1px 5px; border-radius: 999px;
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ---- Level tabs (أساسي / B1 / B2) ---- */
  .level-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .level-btn {
    flex: 1; background: white; color: #9992B5;
    border: 2px solid #EDEAFB; border-radius: 12px;
    padding: 8px 4px; font-size: 12.5px; font-weight: bold; cursor: pointer;
    font-family: inherit;
  }
  .level-btn small { display: block; font-size: 10px; font-weight: normal; }
  .level-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

  /* ---- Browse mode ---- */
  .category-scroll {
    display: flex; gap: 8px; overflow-x: auto;
    margin-bottom: 16px; padding-bottom: 4px;
  }
  .category-chip {
    flex: 0 0 auto;
    background: white; color: var(--primary);
    border: 2px solid #EDEAFB;
    padding: 9px 16px; border-radius: 999px;
    font-size: 12.5px; font-weight: bold; white-space: nowrap; cursor: pointer;
  }
  .category-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: white; border-radius: 14px; padding: 10px 14px;
    margin-bottom: 14px; box-shadow: 0 3px 10px rgba(108,76,224,0.08);
  }
  .search-box input {
    border: none; outline: none; flex: 1; font-size: 13px;
    font-family: inherit; background: transparent; color: var(--text);
  }
  .search-box .icon { color: var(--primary); }
  .empty-state {
    text-align: center; color: #B0A8CC; font-size: 13px;
    padding: 30px 0;
  }

  .word-card {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: 0 4px 14px rgba(108,76,224,0.08);
    display: flex; align-items: center; gap: 12px;
  }
  .word-card .info { flex: 1; }
  .word-kr { font-size: 17px; font-weight: bold; }
  .word-roman { font-size: 11.5px; color: var(--primary); margin-top: 2px; }
  .word-ar { font-size: 12.5px; color: #8A82A6; margin-top: 4px; }
  .play-btn {
    flex: 0 0 auto;
    width: 38px; height: 38px; border-radius: 50%;
    background: #F1ECFF; color: var(--primary);
    border: none; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .play-btn.playing { background: var(--primary); color: white; }

  /* ---- Review mode ---- */
  .review-empty {
    text-align: center; padding: 40px 20px;
    background: white; border-radius: 20px;
    box-shadow: 0 4px 14px rgba(108,76,224,0.08);
  }
  .review-empty .big-emoji { font-size: 40px; margin-bottom: 10px; }
  .review-empty p { font-size: 13px; color: #8A82A6; line-height: 1.7; }

  .review-progress { text-align: center; font-size: 12px; color: #8A82A6; margin-bottom: 12px; }

  .flashcard {
    background: white;
    border-radius: 22px;
    min-height: 220px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
    box-shadow: 0 6px 20px rgba(108,76,224,0.12);
    margin-bottom: 16px;
    cursor: pointer;
    text-align: center;
  }
  .flashcard .fc-kr { font-size: 32px; font-weight: bold; color: var(--text); }
  .flashcard .fc-roman { font-size: 13px; color: var(--primary); margin-top: 8px; }
  .flashcard .fc-hint { font-size: 11px; color: #B0A8CC; margin-top: 14px; }
  .flashcard .fc-ar { font-size: 16px; color: var(--accent); font-weight: bold; margin-top: 14px; display: none; }
  .flashcard.flipped .fc-ar { display: block; }
  .flashcard.flipped .fc-hint { display: none; }

  .review-play {
    background: #F1ECFF; color: var(--primary); border: none;
    border-radius: 12px; padding: 8px 16px; font-size: 12px;
    font-weight: bold; margin-top: 12px; cursor: pointer;
  }

  .quality-buttons {
    display: none;
    gap: 8px;
  }
  .quality-buttons.show { display: grid; grid-template-columns: repeat(4, 1fr); }
  .quality-buttons button {
    border: none; border-radius: 12px; padding: 12px 4px;
    font-size: 11px; font-weight: bold; cursor: pointer; color: white;
  }
  .q-again { background: var(--danger); }
  .q-hard { background: #E0A756; }
  .q-good { background: var(--primary-light); }
  .q-easy { background: var(--success); }

  .word-ex {
    margin-top: 8px; padding: 8px 10px; border-radius: 10px;
    background: #F7F4FF; cursor: pointer;
  }
  .word-ex .ex-ko { display: block; font-size: 13px; color: var(--text); direction: ltr; text-align: left; }
  .word-ex .ex-ar { display: block; font-size: 11.5px; color: #8A82A6; margin-top: 2px; }
  .flashcard .fc-ex { display: none; margin-top: 14px; padding-top: 12px; border-top: 1px dashed #E4DCFB; width: 100%; }
  .flashcard.flipped .fc-ex { display: block; }
  .fc-ex .ex-ko { font-size: 14px; direction: ltr; }
  .fc-ex .ex-ar { font-size: 12px; color: #8A82A6; margin-top: 3px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: white;
    padding: 10px 18px; border-radius: 12px; font-size: 13px;
    opacity: 0; transition: all 0.3s ease; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<div class="app">

</div>

<div class="toast" id="toast"></div>

  function withMeta(w, c) {
    const e = EXAMPLES[w.kr];
    return { ...w, categoryId: c.id, level: c.level, ex: e ? e[0] : "", exAr: e ? e[1] : "" };
  }
  const ALL_WORDS = CATEGORIES.flatMap((c) => c.words.map((w) => withMeta(w, c)));

  const LEVEL_KEY = "korean_vocab_level";
  const NEW_PER_ROUND = 15; // أقصى عدد كلمات جديدة في كل جولة مراجعة

  function loadLevel() {
    try {
      const v = localStorage.getItem(LEVEL_KEY);
      if (LEVELS.some((l) => l.id === v)) return v;
    } catch (e) {}
    return "basic";
  }
  function saveLevel(v) {
    try { localStorage.setItem(LEVEL_KEY, v); } catch (e) {}
  }

  let currentLevel = loadLevel();
  let currentCategoryId = (CATEGORIES.find((c) => c.level === currentLevel) || CATEGORIES[0]).id;
  let currentMode = "browse";

  // ---------------- Audio (WAV أولاً، speechSynthesis كبديل تلقائي) ----------------
  function speak(kr, roman) {
    playKoreanAudio(kr, roman, "audio/vocabulary");
  }

  // نطق جملة المثال: ملف WAV أولاً (audio/vocabulary/ex_<roman>.wav) ثم صوت المتصفح كبديل
  function speakSentence(text, roman) {
    if (!roman) { speakSentenceTTS(text); return; }
    let fell = false;
    const fb = () => { if (!fell) { fell = true; speakSentenceTTS(text); } };
    try {
      const a = new Audio("audio/vocabulary/ex_" + roman + ".wav");
      a.onerror = fb;
      const pr = a.play();
      if (pr && pr.catch) pr.catch(fb);
    } catch (e) { fb(); }
  }
  function speakSentenceTTS(text) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR";
    u.rate = 0.9;
    const v = speechSynthesis.getVoices().find((x) => x.lang && x.lang.replace("_", "-").toLowerCase().indexOf("ko") === 0);
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }

  // ---------------- Mode tabs ----------------
  document.querySelectorAll(".mode-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      currentMode = btn.dataset.mode;
      document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`view-${currentMode}`).classList.add("active");
      if (currentMode === "review") renderReview();
    });
  });

  // ---------------- Level tabs ----------------
  const levelTabs = document.getElementById("level-tabs");
  function renderLevels() {
    levelTabs.innerHTML = LEVELS.map(
      (l) =>
        `<button class="level-btn ${l.id === currentLevel ? "active" : ""}" data-level="${l.id}">${l.label}<small>${l.sub}</small></button>`
    ).join("");
    levelTabs.querySelectorAll(".level-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        currentLevel = btn.dataset.level;
        saveLevel(currentLevel);
        currentCategoryId = CATEGORIES.find((c) => c.level === currentLevel).id;
        renderLevels();
        renderChips();
        renderBrowse();
        updateDueBadge();
        if (currentMode === "review") renderReview();
      });
    });
  }

  // ---------------- Browse mode ----------------
  let searchQuery = "";
  const categoryScroll = document.getElementById("category-scroll");

  function renderChips() {
    const cats = CATEGORIES.filter((c) => c.level === currentLevel);
    categoryScroll.innerHTML = cats
      .map(
        (c) =>
          `<div class="category-chip ${c.id === currentCategoryId ? "active" : ""}" data-id="${c.id}">${c.chip}</div>`
      )
      .join("");
    categoryScroll.querySelectorAll(".category-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        currentCategoryId = chip.dataset.id;
        renderBrowse();
      });
    });
  }

  document.getElementById("search-input").addEventListener("input", (e) => {
    searchQuery = e.target.value.trim().toLowerCase();
    renderBrowse();
  });

  function getVisibleWords() {
    if (searchQuery) {
      return ALL_WORDS.filter(
        (w) =>
          w.ar.toLowerCase().includes(searchQuery) ||
          w.roman.toLowerCase().includes(searchQuery) ||
          w.kr.includes(searchQuery)
      );
    }
    const cat = CATEGORIES.find((c) => c.id === currentCategoryId);
    return cat ? cat.words.map((w) => withMeta(w, cat)) : [];
  }

  function renderBrowse() {
    categoryScroll.style.display = searchQuery ? "none" : "flex";
    categoryScroll.querySelectorAll(".category-chip").forEach((c) =>
      c.classList.toggle("active", c.dataset.id === currentCategoryId)
    );

    const words = getVisibleWords();
    const list = document.getElementById("word-list");

    if (words.length === 0) {
      list.innerHTML = `<div class="empty-state">مفيش نتائج... جرّب كلمة تانية 🔍</div>`;
      return;
    }

    list.innerHTML = words
      .map(
        (w) => `
        <div class="word-card">
          <button class="play-btn" data-text="${w.kr}" data-roman="${w.roman}">🔊</button>
          <div class="info">
            <div class="word-kr">${w.kr}</div>
            <div class="word-roman">${w.roman}</div>
            <div class="word-ar">${w.ar}</div>
            ${w.ex ? `<div class="word-ex" data-ex="${w.ex}" data-roman="${w.roman}"><span class="ex-ko">🔈 ${w.ex}</span><span class="ex-ar">${w.exAr}</span></div>` : ""}
          </div>
        </div>`
      )
      .join("");

    list.querySelectorAll(".word-ex").forEach((el) => {
      el.addEventListener("click", () => speakSentence(el.dataset.ex, el.dataset.roman));
    });

    list.querySelectorAll(".play-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        speak(btn.dataset.text, btn.dataset.roman);
        btn.classList.add("playing");
        setTimeout(() => btn.classList.remove("playing"), 700);
      });
    });
  }

  // ---------------- Review mode (SRS) ----------------
  let reviewQueue = [];
  let reviewIndex = 0;
  let isFlipped = false;

  function getWordKey(w) {
    return `vocab_${w.categoryId}_${w.kr}`;
  }

  // الكلمات المستحقة للمراجعة + أول NEW_PER_ROUND كلمة جديدة (من المستوى المختار أولاً)
  function getReviewQueue() {
    const dueSet = new Set(KoreanProgress.getDueCards(ALL_WORDS.map(getWordKey)));
    const due = ALL_WORDS.filter((w) => dueSet.has(getWordKey(w)));
    const seen = due.filter((w) => KoreanProgress.getCardInfo(getWordKey(w)));
    const fresh = due
      .filter((w) => !KoreanProgress.getCardInfo(getWordKey(w)))
      .sort((a, b) => (b.level === currentLevel) - (a.level === currentLevel));
    return seen.concat(fresh.slice(0, NEW_PER_ROUND));
  }

  function updateDueBadge() {
    const count = getReviewQueue().length;
    const badge = document.getElementById("due-badge");
    if (count > 0) {
      badge.style.display = "inline-block";
      badge.textContent = count;
    } else {
      badge.style.display = "none";
    }
  }

  function renderReview() {
    reviewQueue = getReviewQueue();
    reviewIndex = 0;
    isFlipped = false;
    renderReviewCard();
  }

  function renderReviewCard() {
    const content = document.getElementById("review-content");

    if (reviewQueue.length === 0) {
      content.innerHTML = `
        <div class="review-empty">
          <div class="big-emoji">🎉</div>
          <p>مفيش كلمات محتاجة مراجعة دلوقتي!<br/>ارجع تاني بكرة، أو تصفّح الكلمات من التاب التاني.</p>
        </div>`;
      return;
    }

    if (reviewIndex >= reviewQueue.length) {
      content.innerHTML = `
        <div class="review-empty">
          <div class="big-emoji">✅</div>
          <p>خلّصت الجولة دي! لو عايز كلمات جديدة افتح "مراجعة اليوم" تاني، أو ارجع بكرة.</p>
        </div>`;
      updateDueBadge();
      return;
    }

    const word = reviewQueue[reviewIndex];
    content.innerHTML = `
      <div class="review-progress">كلمة ${reviewIndex + 1} من ${reviewQueue.length}</div>
      <div class="flashcard" id="flashcard">
        <div class="fc-kr">${word.kr}</div>
        <div class="fc-roman">${word.roman}</div>
        <div class="fc-hint">👆 دوس عشان تشوف المعنى</div>
        <div class="fc-ar">${word.ar}</div>
        ${word.ex ? `<div class="fc-ex"><div class="ex-ko">${word.ex}</div><div class="ex-ar">${word.exAr}</div></div>` : ""}
      </div>
      <div style="text-align:center;">
        <button class="review-play" id="review-play-btn">🔊 اسمع النطق</button>
        ${word.ex ? `<button class="review-play" id="review-ex-btn" style="margin-right:8px;">🔈 اسمع الجملة</button>` : ""}
      </div>
      <div class="quality-buttons" id="quality-buttons">
        <button class="q-again" data-q="1">غلط 😖</button>
        <button class="q-hard" data-q="3">صعبة 😐</button>
        <button class="q-good" data-q="4">تمام 🙂</button>
        <button class="q-easy" data-q="5">سهلة 😎</button>
      </div>`;

    document.getElementById("flashcard").addEventListener("click", () => {
      isFlipped = true;
      document.getElementById("flashcard").classList.add("flipped");
      document.getElementById("quality-buttons").classList.add("show");
    });

    document.getElementById("review-play-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      speak(word.kr, word.roman);
    });

    const exBtn = document.getElementById("review-ex-btn");
    if (exBtn) exBtn.addEventListener("click", (e) => { e.stopPropagation(); speakSentence(word.ex, word.roman); });

    document.querySelectorAll(".quality-buttons button").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const quality = parseInt(btn.dataset.q, 10);
        KoreanProgress.reviewCard(getWordKey(word), quality);
        reviewIndex++;
        isFlipped = false;
        renderReviewCard();
      });
    });
  }

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
  }

  // ---------------- Init ----------------
  renderLevels();
  renderChips();
  renderBrowse();
  updateDueBadge();
