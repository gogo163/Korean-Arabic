<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>السفر والسياحة</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5F9;--ink:#14213D;--muted:#5B6B82;--card:#fff;--accent:#E8781A;--line:#D5DEE9}
@media(prefers-color-scheme:dark){:root{--bg:#101826;--ink:#E8EEF7;--muted:#93A3BA;--card:#1A2536;--line:#2C3B52}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Arabic',system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 16px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
summary{padding:14px;font-weight:700;font-size:17px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary span.n{margin-inline-start:auto;font-weight:400;font-size:13px;color:var(--muted)}
.note{padding:0 14px 8px;color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-inline:0;border-bottom:0;color:inherit;font:inherit;text-align:start;cursor:pointer}
.row:active{background:var(--line)}
.row .t{flex:1}
.ko{font:700 20px 'Noto Sans KR',sans-serif;direction:ltr;text-align:right}
.rom{font-size:13px;color:var(--muted);direction:ltr;text-align:right}
.ar{font-size:15px;margin-top:2px}
.ic{width:38px;height:38px;flex:none;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:16px}
.row.on .ic{outline:3px solid var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>🐯 السفر والسياحة</h1>
  <div id="list"></div>
</main>
<script src="progress.js"></script>
<script src="travel-data.js"></script>
<script>
const AUDIO_DIR='audio/travel/';
const fileOf=rom=>rom.toLowerCase().replace(/[?!.,]/g,'').trim().replace(/\s+/g,'_');
let audio=null,active=null;

// تتبّع العبارات اللي اتسمعت؛ لما القسم يخلص بياخد ✅ ونقط مرة واحدة
const HEARD_KEY='korean_travel_heard';
const heard=(()=>{try{return JSON.parse(localStorage.getItem(HEARD_KEY))||{}}catch(e){return {}}})();
function markHeard(sec,i,mk){
  const set=new Set(heard[sec.id]||[]);set.add(i);heard[sec.id]=[...set];
  try{localStorage.setItem(HEARD_KEY,JSON.stringify(heard))}catch(e){}
  if(set.size<sec.items.length)return;
  mk.textContent='✅';
  const P=window.KoreanProgress,id='travel_'+sec.id;
  if(P&&!P.getState().lessonsCompleted.includes(id))P.completeLesson(id,10);
}

function speak(ko,rom,row){
  if(audio){audio.pause();audio=null}
  if(active)active.classList.remove('on');
  active=row;row.classList.add('on');
  const tts=()=>{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(ko);u.lang='ko-KR';u.rate=.85;speechSynthesis.speak(u);
  };
  audio=new Audio(AUDIO_DIR+fileOf(rom)+'.wav');
  audio.onerror=tts;
  audio.onended=()=>row.classList.remove('on');
  audio.play().catch(tts);
}

const list=document.getElementById('list');
TRAVEL.forEach((s,idx)=>{
  const d=document.createElement('details');
  if(idx===0)d.open=true;
  const sum=document.createElement('summary');
  sum.innerHTML='<span>'+s.icon+'</span><span>'+s.title+'</span><span class="n">'+s.items.length+'</span><span class="mk">'+((heard[s.id]||[]).length>=s.items.length?'✅':'')+'</span>';
  const mk=sum.querySelector('.mk');
  d.appendChild(sum);
  if(s.note){const n=document.createElement('div');n.className='note';n.textContent=s.note;d.appendChild(n)}
  s.items.forEach(([ko,rom,ar],i)=>{
    const b=document.createElement('button');
    b.className='row';
    b.innerHTML='<div class="ic">🔊</div><div class="t"><div class="ko"></div><div class="rom"></div><div class="ar"></div></div>';
    b.querySelector('.ko').textContent=ko;
    b.querySelector('.rom').textContent=rom;
    b.querySelector('.ar').textContent=ar;
    b.onclick=()=>{speak(ko,rom,b);markHeard(s,i,mk)};
    d.appendChild(b);
  });
  list.appendChild(d);
});
</script>
</body>
</html>
