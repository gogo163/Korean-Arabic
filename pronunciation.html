<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>النطق — 발음</title>
<style>
  :root{
    --primary:#6C4CE0; --primary-light:#9B7FF0; --primary-dark:#4E33B8;
    --accent:#FF6FA5; --bg:#F7F5FF; --text:#2A2140; --muted:#8A82A6; --track:#E4DCFB;
    --ok:#34C77B; --no:#E0567A; --rec:#E5484D;
    --ko:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Nanum Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Tahoma','Segoe UI',sans-serif;background:linear-gradient(180deg,var(--bg) 0%,#ECE7FF 100%);color:var(--text);min-height:100vh;padding:16px;padding-bottom:50px;line-height:1.7}
  .app{max-width:480px;margin:0 auto}
  .ko{font-family:var(--ko);direction:ltr;unicode-bidi:isolate;display:inline-block}
  .back-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--primary);border:2px solid #EDEAFB;border-radius:12px;padding:8px 14px;font-size:12.5px;font-weight:bold;text-decoration:none;margin-bottom:14px}
  header{text-align:center;margin-bottom:14px}
  header h1{font-size:19px;color:var(--primary)}
  header p{font-size:12px;color:var(--muted);margin-top:4px}

  .tabs{display:flex;gap:8px;margin-bottom:14px;background:#fff;padding:6px;border-radius:14px;box-shadow:0 4px 14px rgba(108,76,224,.08)}
  .tab{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:10px;font:inherit;font-size:13px;font-weight:bold;color:#9992B5;cursor:pointer}
  .tab.active{background:var(--primary);color:#fff}
  .view{display:none}.view.active{display:block}

  .chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .chip{border:2px solid #EDEAFB;background:#fff;color:var(--primary);border-radius:999px;padding:7px 14px;font:inherit;font-size:12.5px;font-weight:bold;cursor:pointer}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .count{font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px}

  .card{background:#fff;border-radius:22px;padding:22px 18px;box-shadow:0 6px 20px rgba(108,76,224,.12);text-align:center;margin-bottom:12px}
  .big{font-size:56px;font-weight:bold;line-height:1.3}
  .say{font-size:16px;color:var(--primary);margin-top:2px}
  .mean{font-size:14px;color:var(--accent);font-weight:bold;margin-top:6px}
  .hint{font-size:12.5px;color:var(--muted);margin-top:8px;padding:8px 10px;background:#F7F4FF;border-radius:10px}

  .row{display:flex;gap:8px;margin-bottom:10px}
  .btn{flex:1;border:0;border-radius:14px;padding:13px 6px;font:inherit;font-size:13.5px;font-weight:bold;cursor:pointer;color:#fff;background:var(--primary);box-shadow:0 4px 0 var(--primary-dark)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-dark)}
  .btn.rec{background:var(--rec);box-shadow:0 4px 0 #A92C30}
  .btn.rec.on{animation:pulse 1s infinite}
  .btn.alt{background:#fff;color:var(--primary);box-shadow:0 3px 10px rgba(108,76,224,.12)}
  .btn[disabled]{opacity:.45;cursor:default}
  @keyframes pulse{50%{transform:scale(1.03)}}
  @media (prefers-reduced-motion:reduce){.btn.rec.on{animation:none}}

  .rate{display:none;gap:8px;margin-bottom:10px}
  .rate.show{display:flex}
  .rate button{flex:1;border:0;border-radius:12px;padding:11px 4px;font:inherit;font-size:12.5px;font-weight:bold;color:#fff;cursor:pointer}
  .r-ok{background:var(--ok)} .r-no{background:var(--no)}
  .msg{font-size:12.5px;text-align:center;color:var(--muted);min-height:20px;margin-bottom:8px}
  .msg.err{color:var(--no)}
  .stat{text-align:center;font-size:11.5px;color:#B0A8CC;margin-top:6px}

  .rule{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(108,76,224,.08)}
  .rule h2{font-size:14.5px;color:var(--primary);margin-bottom:4px}
  .rule p{font-size:12.5px;color:#5d5578;margin-bottom:8px}
  .ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--track)}
  .ex .t{flex:1;min-width:0}
  .ex .k{font-size:17px}
  .ex .s{font-size:12.5px;color:var(--primary)}
  .ex .a{font-size:11.5px;color:var(--muted)}
  .snd{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:0;background:#F1ECFF;color:var(--primary);font-size:14px;cursor:pointer}
  .snd.playing{background:var(--primary);color:#fff}
  button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <a href="index.html" class="back-btn" onclick="return goBack(event)">→ الرئيسية</a>
  <header>
    <h1>🎤 النطق</h1>
    <p>اسمع النطق الأصلي، سجّل صوتك، وقارن بينهم</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-view="practice">🎤 تدرّب</button>
    <button class="tab" data-view="rules">📘 قواعد النطق</button>
  </div>

  <!-- ===================== تدرّب ===================== -->
  <div class="view active" id="view-practice">
    <div class="chips" id="filters"></div>
    <div class="count" id="count"></div>
    <div class="card" id="card"></div>

    <div class="row">
      <button class="btn alt" id="btn-native">🔊 النطق الأصلي</button>
      <button class="btn rec" id="btn-rec">🎤 سجّل</button>
      <button class="btn alt" id="btn-mine" disabled>▶ صوتك</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="rate" id="rate">
      <button class="r-ok" id="rate-ok">قريب من الأصلي ✓</button>
      <button class="r-no" id="rate-no">محتاج تدريب</button>
    </div>
    <div class="row">
      <button class="btn alt" id="prev">→ السابق</button>
      <button class="btn alt" id="next">التالي ←</button>
    </div>
    <div class="stat" id="stat"></div>
  </div>

  <!-- ===================== قواعد النطق ===================== -->
  <div class="view" id="view-rules"><div id="rules"></div></div>
</div>

<script src="progress.js"></script>
<script src="audio-helper.js"></script>
<script>
/* =====================================================================
   بيانات النطق — لإضافة عنصر جديد انسخ سطرًا وعدّله.
   kr: الكتابة | say: النطق الفعلي | roman: اسم ملف الصوت (audio/pronunciation/<roman>.wav)
   ===================================================================== */
const LETTERS = [
 {kr:'가',roman:'ga',say:'ga',ar:'ㄱ + ㅏ',hint:'ㄱ العادية: بين ك وج، خفيفة وبدون نَفَس قوي.'},
 {kr:'카',roman:'ka',say:'ka',ar:'ㅋ + ㅏ',hint:'ㅋ: ك مع نَفَس قوي (حط إيدك قدّام بقك وحس بالهوا).'},
 {kr:'까',roman:'kka',say:'kka',ar:'ㄲ + ㅏ',hint:'ㄲ: ك مشدودة من غير أي هوا يطلع.'},
 {kr:'다',roman:'da',say:'da',ar:'ㄷ + ㅏ',hint:'ㄷ العادية: بين د وت، خفيفة.'},
 {kr:'타',roman:'ta',say:'ta',ar:'ㅌ + ㅏ',hint:'ㅌ: ت مع نَفَس قوي.'},
 {kr:'따',roman:'tta',say:'tta',ar:'ㄸ + ㅏ',hint:'ㄸ: ت مشدودة من غير هوا.'},
 {kr:'바',roman:'ba',say:'ba',ar:'ㅂ + ㅏ',hint:'ㅂ العادية: بين ب وپ، خفيفة.'},
 {kr:'파',roman:'pa',say:'pa',ar:'ㅍ + ㅏ',hint:'ㅍ: پ مع نَفَس قوي.'},
 {kr:'빠',roman:'ppa',say:'ppa',ar:'ㅃ + ㅏ',hint:'ㅃ: ب مشدودة من غير هوا.'},
 {kr:'자',roman:'ja',say:'ja',ar:'ㅈ + ㅏ',hint:'ㅈ العادية: بين ج وتش، خفيفة.'},
 {kr:'차',roman:'cha',say:'cha',ar:'ㅊ + ㅏ',hint:'ㅊ: تش مع نَفَس قوي.'},
 {kr:'짜',roman:'jja',say:'jja',ar:'ㅉ + ㅏ',hint:'ㅉ: تش مشدودة من غير هوا.'},
 {kr:'어',roman:'eo',say:'eo',ar:'ㅓ',hint:'ㅓ: فتح الفم أكتر من ㅗ، صوت قريب من «أُ» مفتوحة.'},
 {kr:'오',roman:'o',say:'o',ar:'ㅗ',hint:'ㅗ: شفايفك مستديرة، صوت «أو» مقفولة.'},
 {kr:'으',roman:'eu',say:'eu',ar:'ㅡ',hint:'ㅡ: شفايفك مفرودة (مش مستديرة) والصوت من ورا.'},
 {kr:'우',roman:'u',say:'u',ar:'ㅜ',hint:'ㅜ: شفايفك مستديرة وبارزة، «أو» طويلة.'}
];

const WORDS = [
 {kr:'한국어',roman:'hangugeo',say:'한구거',ar:'اللغة الكورية'},
 {kr:'먹어요',roman:'meogeoyo',say:'머거요',ar:'بياكل'},
 {kr:'음악이',roman:'eumagi',say:'으마기',ar:'الموسيقى (فاعل)'},
 {kr:'꽃이',roman:'kkochi',say:'꼬치',ar:'الزهرة (فاعل)'},
 {kr:'읽어요',roman:'ilgeoyo',say:'일거요',ar:'بيقرا'},
 {kr:'있어요',roman:'isseoyo',say:'이써요',ar:'موجود'},
 {kr:'밖',roman:'bak',say:'박',ar:'برّه'},
 {kr:'부엌',roman:'bueok',say:'부억',ar:'مطبخ'},
 {kr:'낮',roman:'nat',say:'낟',ar:'النهار'},
 {kr:'앞',roman:'ap',say:'압',ar:'قدّام'},
 {kr:'학교',roman:'hakgyo',say:'학꾜',ar:'مدرسة'},
 {kr:'먹다',roman:'meokda',say:'먹따',ar:'ياكل'},
 {kr:'식당',roman:'sikdang',say:'식땅',ar:'مطعم'},
 {kr:'한국말',roman:'hangungmal',say:'한궁말',ar:'الكلام الكوري'},
 {kr:'감사합니다',roman:'gamsahamnida',say:'감사함니다',ar:'شكرًا'},
 {kr:'십만',roman:'simman',say:'심만',ar:'مية ألف'},
 {kr:'좋다',roman:'jota',say:'조타',ar:'كويس / حلو'},
 {kr:'입학',roman:'ipak',say:'이팍',ar:'الالتحاق بالدراسة'},
 {kr:'전화',roman:'jeonhwa',say:'저놔',ar:'تليفون'},
 {kr:'괜찮아요',roman:'gwaenchanayo',say:'괜차나요',ar:'مفيش مشكلة'},
 {kr:'좋아요',roman:'joayo',say:'조아요',ar:'حلو / تمام'},
 {kr:'같이',roman:'gachi',say:'가치',ar:'مع بعض'},
 {kr:'붙이다',roman:'buchida',say:'부치다',ar:'يلصق'},
 {kr:'신라',roman:'silla',say:'실라',ar:'مملكة سيلا'},
 {kr:'설날',roman:'seollal',say:'설랄',ar:'رأس السنة القمرية'},
 {kr:'한여름',roman:'hanyeoreum',say:'한녀름',ar:'عزّ الصيف'}
];

const RULES = [
 {t:'1) ثلاثة أصوات لكل حرف',p:'العربية ما فيهاش الفرق ده: العادي خفيف، والمهموس (ㅋ ㅌ ㅍ ㅊ) معاه نَفَس قوي، والمشدّد (ㄲ ㄸ ㅃ ㅉ) مشدود من غير نَفَس.',
  ex:['가','카','까','다','타','따','바','파','빠','자','차','짜'],from:'L'},
 {t:'2) حروف الآخر (받침): سبعة أصوات بس',p:'أي حرف في آخر المقطع بيتنطق بواحد من سبعة أصوات: ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅇ. مثلًا ㅋ و ㄲ بيتنطقوا ㄱ، و ㅅ ㅈ ㅊ ㅌ بيتنطقوا ㄷ، و ㅍ بيتنطق ㅂ.',
  ex:['밖','부엌','낮','앞'],from:'W'},
 {t:'3) الربط (연음)',p:'لو المقطع بينتهي بحرف آخر والمقطع اللي بعده بيبدأ بـ ㅇ (صامتة)، الحرف الأخير بينتقل ويبدأ المقطع التالي.',
  ex:['한국어','먹어요','음악이','꽃이','읽어요','있어요'],from:'W'},
 {t:'4) التشديد (경음화)',p:'بعد ㄱ ㄷ ㅂ في آخر المقطع، الحرف اللي بعده (ㄱ ㄷ ㅂ ㅅ ㅈ) بيتنطق مشدّد.',
  ex:['학교','먹다','식당'],from:'W'},
 {t:'5) الأنفية (비음화)',p:'ㄱ ㄷ ㅂ في آخر المقطع قبل ㄴ أو ㅁ بتتحول لأنفية: ㄱ ← ㅇ، ㄷ ← ㄴ، ㅂ ← ㅁ.',
  ex:['한국말','감사합니다','십만'],from:'W'},
 {t:'6) الهمس (격음화)',p:'ㅎ مع ㄱ ㄷ ㅂ ㅈ (قبلها أو بعدها) بتتحول لصوت مهموس: ㅋ ㅌ ㅍ ㅊ.',
  ex:['좋다','입학'],from:'W'},
 {t:'7) ㅎ بتضعف',p:'ㅎ بين صوتين بتضعف، وفي آخر المقطع قبل ㅇ بتختفي ومبتتنطقش.',
  ex:['전화','괜찮아요','좋아요'],from:'W'},
 {t:'8) ㄷ و ㅌ قبل 이',p:'ㄷ و ㅌ في آخر المقطع قبل 이 بيتحولوا لـ ㅈ و ㅊ.',
  ex:['같이','붙이다'],from:'W'},
 {t:'9) ㄴ بجانب ㄹ',p:'ㄴ جنب ㄹ بتتحول ㄹ.',
  ex:['신라','설날'],from:'W'},
 {t:'10) إضافة ㄴ',p:'في بعض الكلمات المركّبة، لو الكلمة الأولى بتنتهي بحرف آخر والتانية بتبدأ بـ 이 / 야 / 여 / 요 / 유 بيتضاف صوت ㄴ.',
  ex:['한여름'],from:'W'}
];

const ITEMS = LETTERS.map(x => ({...x, kind:'L'})).concat(WORDS.map(x => ({...x, kind:'W'})));
const AUDIO_DIR = 'audio/pronunciation';
const ATT_KEY = 'korean_pronunciation_attempts';

/* ---------- الصوت الأصلي: ملف WAV أولاً ثم صوت المتصفح ---------- */
function ttsFallback(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find(x => x.lang && x.lang.replace('_','-').toLowerCase().indexOf('ko')===0);
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
function playNative(it){
  if(typeof playKoreanAudio === 'function'){ playKoreanAudio(it.kr, it.roman, AUDIO_DIR); return; }
  let fell=false; const fb=()=>{ if(!fell){ fell=true; ttsFallback(it.kr); } };
  try{ const a=new Audio(AUDIO_DIR+'/'+it.roman+'.wav'); a.onerror=fb; const p=a.play(); if(p&&p.catch) p.catch(fb); }catch(e){ fb(); }
}

/* ---------- الرجوع: داخل Kodular يغلق الشاشة (الرسالة "back")، وخارجه يرجع للرئيسية ---------- */
function goBack(e){
  try{
    if(window.AppInventor && typeof window.AppInventor.setWebViewString === 'function'){
      e.preventDefault();
      window.AppInventor.setWebViewString('back');
      setTimeout(function(){ location.href = 'index.html'; }, 900); // احتياطي لو الشاشة ما اتقفلتش
      return false;
    }
  }catch(err){}
  return true;
}

/* ---------- التبويبات ---------- */
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('view-'+b.dataset.view).classList.add('active');
}));

/* ---------- التدرّب ---------- */
let filter = 'all', list = ITEMS.slice(), idx = 0, lastUrl = null, rec = null, stream = null, rated = false;
let micOff = false;
const $ = id => document.getElementById(id);

function attempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY),10) || 0; }catch(e){ return 0; } }
function bumpAttempts(){ try{ localStorage.setItem(ATT_KEY, String(attempts()+1)); }catch(e){} }

function renderFilters(){
  const F = [['all','الكل'],['L','حروف'],['W','كلمات']];
  $('filters').innerHTML = F.map(f => '<button class="chip'+(filter===f[0]?' active':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>').join('');
  $('filters').querySelectorAll('.chip').forEach(c => c.onclick = () => {
    filter = c.dataset.f;
    list = filter==='all' ? ITEMS.slice() : ITEMS.filter(i => i.kind===filter);
    idx = 0; renderFilters(); renderCard();
  });
}
// لو الميكروفون مش متاح (زي WebView في Kodular): وضع التدرّب بدون تسجيل
function setMicOff(){
  micOff = true;
  $('btn-rec').style.display = 'none';
  $('btn-mine').style.display = 'none';
  $('rate').classList.add('show');
  $('msg').classList.remove('err');
  $('msg').textContent = 'التسجيل مش متاح في التطبيق حاليًا. اسمع النطق الأصلي وكرّره بصوتك، وبعدين قيّم نفسك.';
}
/* ---------- التسجيل عبر Kodular (SoundRecorder) — زي التطبيق الياباني ----------
   الرسائل المستخدمة بالظبط: RECORD_START / RECORD_STOP / PLAY_LAST
   والرد من Kodular: "RECORDED:<مسار الملف>" عبر WebViewString. */
// وضع المسجّل الأصلي (Sound Recorder) اختياري: يعمل فقط لو فتحت الصفحة بـ ?native=1
// الافتراضي: التسجيل بالمتصفح (getUserMedia) داخل CustomWebView اللي بيمنح إذن الميكروفون.
const HAS_BRIDGE = /[?&]native=1\b/.test(location.search) && !!(window.AppInventor && typeof window.AppInventor.setWebViewString === 'function');
let nativeRecording = false, nativeHas = false, pollTimer = null;
function bridgeSend(cmd){ try{ window.AppInventor.setWebViewString(cmd); }catch(e){} }
function waitRecorded(cb){
  let tries = 0;
  clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    tries++;
    let v = '';
    try{ v = String(window.AppInventor.getWebViewString() || ''); }catch(e){}
    if(v.indexOf('RECORDED:') === 0){ clearInterval(pollTimer); cb(true); }
    else if(tries >= 25){ clearInterval(pollTimer); cb(false); }
  }, 300);
}
function nativeToggle(){
  const btn = $('btn-rec');
  if(!nativeRecording){
    resetRecording();
    nativeRecording = true;
    bridgeSend('RECORD_START');
    btn.classList.add('on'); btn.textContent = '⏹ وقّف';
    $('msg').textContent = 'بيسجّل... انطق الكلمة وبعدين دوس وقّف.';
    return;
  }
  nativeRecording = false;
  bridgeSend('RECORD_STOP');
  btn.classList.remove('on'); btn.textContent = '🎤 سجّل';
  $('msg').textContent = 'بيحفظ التسجيل...';
  waitRecorded(ok => {
    if(!ok){ $('msg').textContent = 'التسجيل ما اتحفظش، جرّب تاني.'; $('msg').classList.add('err'); return; }
    nativeHas = true;
    $('btn-mine').disabled = false;
    $('rate').classList.add('show');
    $('msg').textContent = 'اسمع صوتك وقارنه بالنطق الأصلي، وبعدين قيّم نفسك.';
    bridgeSend('PLAY_LAST');
  });
}

function resetRecording(){
  if(lastUrl){ URL.revokeObjectURL(lastUrl); lastUrl = null; }
  nativeHas = false; clearInterval(pollTimer);
  $('btn-mine').disabled = true;
  $('rate').classList.remove('show');
  $('msg').textContent = ''; $('msg').classList.remove('err');
  rated = false;
}
function renderCard(){
  const it = list[idx];
  resetRecording();
  $('count').textContent = (idx+1) + ' / ' + list.length;
  if(micOff) setMicOff();
  $('card').innerHTML =
    '<div class="big"><span class="ko">'+it.kr+'</span></div>'
    + (it.kind==='W' ? '<div class="say">النطق الفعلي: <span class="ko">['+it.say+']</span></div>' : '<div class="say"><span class="ko">'+it.roman+'</span></div>')
    + '<div class="mean">'+it.ar+'</div>'
    + (it.hint ? '<div class="hint">'+it.hint+'</div>' : '');
  $('stat').textContent = 'محاولاتك المسجّلة: ' + attempts();
}

$('btn-native').onclick = () => playNative(list[idx]);
$('prev').onclick = () => { idx = (idx - 1 + list.length) % list.length; renderCard(); };
$('next').onclick = () => { idx = (idx + 1) % list.length; renderCard(); };

$('btn-rec').onclick = async () => {
  const btn = $('btn-rec');
  if(HAS_BRIDGE){ nativeToggle(); return; }
  if(rec && rec.state === 'recording'){ rec.stop(); return; }
  if(!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setMicOff(); return;
  }
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ setMicOff(); return; }
  resetRecording();
  const chunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    btn.classList.remove('on'); btn.textContent = '🎤 سجّل';
    if(!chunks.length){ $('msg').textContent = 'التسجيل طلع فاضي، جرّب تاني.'; $('msg').classList.add('err'); return; }
    const blob = new Blob(chunks, {type: rec.mimeType || 'audio/webm'});
    lastUrl = URL.createObjectURL(blob);
    $('btn-mine').disabled = false;
    $('rate').classList.add('show');
    $('msg').textContent = 'اسمع صوتك وقارنه بالنطق الأصلي، وبعدين قيّم نفسك.';
    new Audio(lastUrl).play().catch(() => {});
  };
  rec.start();
  btn.classList.add('on'); btn.textContent = '⏹ وقّف';
  $('msg').textContent = 'بيسجّل... انطق الكلمة وبعدين دوس وقّف.';
};
$('btn-mine').onclick = () => {
  if(HAS_BRIDGE){ if(nativeHas) bridgeSend('PLAY_LAST'); return; }
  if(lastUrl) new Audio(lastUrl).play().catch(() => {});
};

function rate(close){
  if(rated) return; rated = true;
  bumpAttempts();
  if(close){ try{ if(window.KoreanProgress) KoreanProgress.addPoints(2, 'pronunciation'); }catch(e){} }
  $('msg').textContent = close ? 'ممتاز! +2 نقطة 🎉' : 'عادي، كرّر وجرّب تاني.';
  $('stat').textContent = 'محاولاتك المسجّلة: ' + attempts();
}
$('rate-ok').onclick = () => rate(true);
$('rate-no').onclick = () => rate(false);

/* ---------- قواعد النطق ---------- */
function renderRules(){
  const find = (src, kr) => (src==='L' ? LETTERS : WORDS).find(x => x.kr === kr);
  $('rules').innerHTML = RULES.map(r => {
    const rows = r.ex.map(k => {
      const it = find(r.from, k);
      const sound = r.from==='W' ? '<div class="s ko">['+it.say+']</div>' : '<div class="s ko">'+it.roman+'</div>';
      return '<div class="ex"><button class="snd" data-k="'+it.kr+'" data-src="'+r.from+'" aria-label="استمع">🔊</button>'
        + '<div class="t"><div class="k"><span class="ko">'+it.kr+'</span></div>'+sound+'<div class="a">'+it.ar+'</div></div></div>';
    }).join('');
    return '<div class="rule"><h2>'+r.t+'</h2><p>'+r.p+'</p>'+rows+'</div>';
  }).join('');
  $('rules').querySelectorAll('.snd').forEach(b => b.onclick = () => {
    const it = find(b.dataset.src, b.dataset.k);
    playNative(it);
    b.classList.add('playing'); setTimeout(() => b.classList.remove('playing'), 700);
  });
}

if('speechSynthesis' in window){ speechSynthesis.getVoices(); }
renderFilters(); renderCard(); renderRules();
</script>
